name: check-llm-assets

# Lists the llama.cpp server builds and GGUF model files that Pro AI (the optional local language model) can download,
# with exact sizes and SHA-256 checksums, so the app can pin them. Results are on the run's summary page.
# On demand (Actions -> check-llm-assets -> Run workflow) and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install httpx
      - name: List the downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_llm_assets.py --json llm-assets.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: llm-assets
          path: llm-assets.json
          retention-days: 30

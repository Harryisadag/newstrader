name: build-exe

# Run by hand from the Actions tab ("Run workflow"). Builds the Windows app with PyInstaller and
# checks that the built NewsTrader.exe starts. Uploading the result is optional because the folder
# is ~1 GB with the CUDA libraries (private repos have limited free artifact storage).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the built app as a downloadable zip (large, kept 3 days)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build NewsTrader.exe
        run: pyinstaller --noconfirm --clean newstrader.spec

      - name: Start the built exe and check it works
        run: python scripts/smoke_test.py dist/NewsTrader/NewsTrader.exe --tools --ml

      - name: Show build size
        shell: bash
        run: du -sh dist/NewsTrader

      - name: Upload
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: NewsTrader-windows
          path: dist/NewsTrader
          retention-days: 3

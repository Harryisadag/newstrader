name: check-solana-data

# Checks that the free Solana data sources the paper memecoin desk uses still answer (GeckoTerminal, DexScreener,
# Jupiter quotes, the public Solana RPC, RugCheck) and shows trimmed samples. Read-only: nothing is signed or sent.
# Weekly, and on demand: Actions -> check-solana-data -> Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install httpx
      - name: Check the sources
        run: python scripts/check_solana_data.py --raw solana-data | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: solana-data-samples
          path: solana-data
          retention-days: 14

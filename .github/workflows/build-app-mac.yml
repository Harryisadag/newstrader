name: build-app-mac

# Run by hand from the Actions tab ("Run workflow"). Builds NewsTrader.app on an Apple Silicon Mac runner
# with PyInstaller and checks that the built app starts, finds its tools, and loads the FinBERT model.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the built app as a downloadable zip (kept 3 days)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mac-gpu.txt pyinstaller pillow
          pip install --no-deps "mlx-whisper==0.4.3"

      - name: Build NewsTrader.app
        run: pyinstaller --noconfirm --clean newstrader.spec

      - name: Start the built app and check it works
        run: python scripts/smoke_test.py dist/NewsTrader.app/Contents/MacOS/NewsTrader --tools --ml

      - name: Show build size
        run: du -sh dist/NewsTrader.app

      - name: Zip the app (keeps permissions and signatures)
        if: ${{ inputs.upload }}
        run: ditto -c -k --keepParent dist/NewsTrader.app NewsTrader-mac.zip

      - name: Upload
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: NewsTrader-mac
          path: NewsTrader-mac.zip
          retention-days: 3

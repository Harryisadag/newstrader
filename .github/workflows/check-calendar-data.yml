name: check-calendar-data

# Checks that the free sources for the calendar features (earnings dates, Fed / inflation / jobs days), the SEC
# filings watcher and phone alerts still answer, and shows trimmed samples. Read-only.
# Weekly, and on demand: Actions -> check-calendar-data -> Run workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/check_calendar_data.py
      - .github/workflows/check-calendar-data.yml
  schedule:
    - cron: "49 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install httpx
      - name: Check the sources
        run: python scripts/check_calendar_data.py --raw calendar-data | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-data-samples
          path: calendar-data
          retention-days: 14
